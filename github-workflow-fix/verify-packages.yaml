name: Verify packages

# Downloads the package of every item of versions that a PR adds or changes,
# from npm or from its url, and checks it against the manifest: integrity, the
# name and version of its package.json, and engines.freelens against the
# freelens range. Not a required check, as it depends on npm and GitHub.
on:
  pull_request:
    paths:
      - .github/workflows/verify-packages.yaml
      - extensions/**
      - scripts/verify-packages.mjs
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify packages

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15

    steps:
      # The full history, for the manifests of the base of the PR.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # pnpm comes from mise, as Node no longer bundles Corepack from version 26.
      # mise verifies the download against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.14 # datasource=github-releases depName=jdx/mise
          install_args: pnpm

      - name: Get pnpm cache directory
        shell: bash
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> "${GITHUB_ENV}"

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ubuntu-26.04-arm-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-26.04-arm-node-

      - name: Install pnpm dependencies
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      # On a PR, the items the base lacks; run by hand, every item.
      - name: Verify packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |-
          if [ -n "$BASE_SHA" ]; then
            pnpm --color=always verify --base "$BASE_SHA"
          else
            pnpm --color=always verify
          fi
