name: Build extensions.json

on:
  pull_request:
    paths:
      - "extensions/**"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/build-extensions.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/build-extensions.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.8.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (validate + regenerate)
        run: npm run build

      - name: Upload extensions.json artifact
        uses: actions/upload-artifact@v7
        with:
          name: extensions-json
          path: extensions.json
          retention-days: 1

  commit:
    name: Commit extensions.json
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download extensions.json artifact
        uses: actions/download-artifact@v8
        with:
          name: extensions-json
          path: ${{ github.workspace }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extensions.json
          git commit -m "chore: regenerate extensions.json"
          git push
