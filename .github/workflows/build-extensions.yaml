name: Build extensions.json

on:
  # No paths filter on pull requests: "Validate manifests" is a required check
  # of the main ruleset, and a required check that does not run blocks the PR.
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-extensions.yaml
      - .nvmrc
      - extensions/**
      - mise.lock
      - mise.toml
      - package.json
      - pnpm-lock.yaml
      - schema/**
      - scripts/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # pnpm comes from mise, as Node no longer bundles Corepack from version 26.
      # mise verifies the download against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.14 # datasource=github-releases depName=jdx/mise
          install_args: pnpm

      - name: Get pnpm cache directory
        shell: bash
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ubuntu-26.04-arm-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-26.04-arm-node-

      - name: Install pnpm dependencies
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: Build (validate + regenerate)
        run: pnpm --color=always build

      - name: Upload extensions.json artifact
        uses: actions/upload-artifact@v7
        with:
          name: extensions-json
          path: extensions.json
          retention-days: 1

  commit:
    name: Commit extensions.json
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate

    runs-on: ubuntu-26.04-arm
    environment: automated
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      # The push uses GH_TOKEN of the environment, whose account bypasses the
      # required checks of the main ruleset; the workflow token cannot push
      # to main. A push with it also runs the checks on the new commit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Download extensions.json artifact
        uses: actions/download-artifact@v8
        with:
          name: extensions-json
          path: ${{ github.workspace }}

      - name: Commit extensions.json
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions.json
          if git commit -m "Regenerate extensions.json"; then
            git push
          fi
