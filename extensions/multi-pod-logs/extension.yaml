# yaml-language-server: $schema=https://raw.githubusercontent.com/freelensapp/freelens-marketplace/main/schemas/marketplace-extension-v1.schema.json
apiVersion: freelens.app/v1
kind: MarketplaceExtension
metadata:
  name: multi-pod-logs
spec:
  displayName: Multi Pod Logs
  summary: Enables you to see logs from multiple pods (and multiple containers within the pod) on Kubernetes.
  tier: community
  package: "@andrea-falco/freelens-multi-pod-logs"
  versions:
  - version: 1.0.1
    freelens: ^1.0.0
  homepage: https://github.com/andrea-falco/freelens-multi-pod-logs
  repository: https://github.com/andrea-falco/freelens-multi-pod-logs
  license: MIT
